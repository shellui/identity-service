name: Pre-release check

# Automates PUBLISH.md pre-release checklist (version alignment, image secrets, smoke test).
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pre-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  pre-release:
    name: Pre-release checklist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.1'
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Sync dependencies
        run: uv sync --frozen --no-dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run pre-release checklist
        env:
          PRE_RELEASE_HOST_PORT: '18000'
        run: |
          chmod +x ./tools/pre-release-check.sh
          ./tools/pre-release-check.sh --image shellui/identity-service:pre-release
