name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-not-for-production-0123456789abcdef
      DEBUG: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.1'
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Sync dependencies
        run: uv sync --frozen --no-dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build landing CSS (Tailwind)
        run: |
          npm ci
          npm run build:css
          git diff --exit-code static/css/site.css

      - name: Verify lockfile
        run: uv lock --check

      - name: Verify generated OAuth provider artifacts
        run: |
          uv run python tools/generate_allauth_provider_apps.py
          uv run python tools/build_provider_catalog.py
          uv run python tools/render_oauth_providers_doc.py
          git diff --exit-code apps/authapi/provider_catalog.json config/allauth_provider_apps.py docs/oauth-providers.md tools/data/oauth_e2e_covered_slugs.json
      - name: Verify django-allauth version matches catalog
        run: |
          uv run python -c "import importlib.metadata, json; from pathlib import Path; cat=json.loads(Path('apps/authapi/provider_catalog.json').read_text()); assert cat['allauth_version']==importlib.metadata.version('django-allauth')"

      - name: Verify allauth registry matches provider source snapshot
        run: uv run python tools/verify_allauth_registry_snapshot.py

      - name: Django system checks
        run: uv run python manage.py check

      - name: Production deployment checks
        run: |
          uv run python manage.py generate_jwt_keys --shell > /tmp/jwt_keys.sh
          # shellcheck disable=SC1091
          source /tmp/jwt_keys.sh
          DEBUG=false \
          JWT_ISSUER=https://auth.example.com \
          JWT_AUDIENCE=shellui \
          CORS_ALLOW_ALL_ORIGINS=false \
          CORS_ALLOWED_ORIGINS=https://app.example.com \
          uv run python manage.py check --deploy

      - name: Run tests
        run: uv run python manage.py test --verbosity=1

  security:
    name: Security & hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          version=8.28.0
          install_dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "${install_dir}"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C "${install_dir}" gitleaks
          "${install_dir}/gitleaks" detect --source . --verbose --redact --exit-code 1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.1'
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Dependency vulnerabilities (pip-audit)
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt

      - name: Repo hygiene
        run: |
          set -euo pipefail

          # Never commit real env or local DB artifacts
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo '::error::.env is tracked by git — remove it from the repository'
            exit 1
          fi
          if tracked_db="$(git ls-files '*.sqlite3')"; then
            if [ -n "$tracked_db" ]; then
              echo '::error::SQLite database files must not be tracked'
              printf '%s\n' "$tracked_db"
              exit 1
            fi
          fi

          # Brand spelling (Shellui / shellui only)
          if git grep -nIE '\bShellUI\b|\bshellUI\b|\bShellUi\b' -- . \
              ':(exclude).github/workflows/**' \
              ':(exclude).venv'; then
            echo '::error::Use Shellui (product) or shellui (packages); avoid Shell-UI camelCase variants'
            exit 1
          fi

          # High-signal secret patterns in tracked text (PEM private keys)
          if git grep -nIE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- . \
              ':(exclude).github/workflows/**' \
              ':(exclude).env.example' \
              ':(exclude)*.md' \
              ':(exclude)docs/**'; then
            echo '::error::Private key material found in tracked files'
            exit 1
          fi

  links:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .lychee.toml
            --verbose
            --no-progress
            README.md
            CHANGELOG.md
            PUBLISH.md
            docs
          fail: true

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    env:
      # Branch, tag or commit of shellui/shellui, which builds docs.shellui.com.
      # Defaults to main (shellui/shellui has no develop branch).
      # Override with the repository variable SHELLUI_DOCS_REF.
      SHELLUI_DOCS_REF: ${{ vars.SHELLUI_DOCS_REF || 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: identity-service

      # Sibling checkout: the shellui docs fetch script reads ../identity-service/docs.
      - name: Checkout shellui/shellui
        uses: actions/checkout@v4
        with:
          repository: shellui/shellui
          ref: ${{ env.SHELLUI_DOCS_REF }}
          path: shellui

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: shellui/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: shellui/.nvmrc
          cache: pnpm
          cache-dependency-path: shellui/pnpm-lock.yaml

      - name: Install shellui dependencies
        working-directory: shellui
        run: pnpm install --frozen-lockfile

      # Builds docs.shellui.com with only the identity docs, read from this checkout.
      # onBrokenLinks is 'throw', so a broken link or an invalid page fails the job.
      - name: Build docs (identity only)
        working-directory: shellui
        env:
          DOCS_SOURCE: local
          DOCS_SERVICES: identity
          DOCS_SERVICES_DIR: ${{ github.workspace }}
        run: pnpm docs:build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: shellui/identity-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Web server, Celery worker with beat, graceful stop, worker mode, no-Redis fallback.
      - name: Image smoke test
        run: ./tools/image-smoke-test.sh shellui/identity-service:ci
