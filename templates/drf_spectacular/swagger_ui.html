<!DOCTYPE html>
<html>
  <head>
    {% block head %}
    <title>{{ title|default:"Swagger" }}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% if favicon_href %}<link rel="icon" href="{{ favicon_href }}">{% endif %}
    <link rel="stylesheet" href="{{ swagger_ui_css }}">
    <style>
      html { box-sizing: border-box; overflow-y: scroll; }
      *, *:after, *:before { box-sizing: inherit; }
      body { margin: 0; }
    </style>
    {% endblock head %}
  </head>
  <body>
    {% block body %}
    <div id="swagger-ui"></div>
    <script type="module">
      import { init, shellui } from "https://esm.sh/@shellui/sdk@0.2.0?bundle";

      const applyDocsColorMode = (appearance) => {
        const mode = appearance?.mode === "dark" ? "dark" : "light";
        document.documentElement.classList.toggle("dark-mode", mode === "dark");
        document.documentElement.style.colorScheme = mode;
      };

      const handleSettingsMessage = (message) => {
        applyDocsColorMode(message?.payload?.settings?.appearance ?? null);
        const token = message?.payload?.settings?.accessToken ?? null;
        window.__shelluiAccessToken = token;
        window.__applyShelluiAccessToken?.(token);
      };

      await init();
      applyDocsColorMode(shellui.initialSettings?.appearance ?? null);
      window.__shelluiAccessToken = shellui.initialSettings?.accessToken ?? null;
      window.__applyShelluiAccessToken?.(window.__shelluiAccessToken);
      shellui.addMessageListener("SHELLUI_SETTINGS", handleSettingsMessage);
      shellui.addMessageListener("SHELLUI_SETTINGS_UPDATED", handleSettingsMessage);
    </script>
    <script src="{{ swagger_ui_bundle }}"></script>
    <script src="{{ swagger_ui_standalone }}"></script>
    {% if script_url %}
    <script src="{{ script_url }}"></script>
    {% else %}
    <script>
    {% include template_name_js %}
    </script>
    {% endif %}
    {% endblock %}
  </body>
</html>
