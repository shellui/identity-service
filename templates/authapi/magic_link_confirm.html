<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm sign-in</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #111827;
      --primary-hover: #1f2937;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1419;
        --card: #151b23;
        --text: #e7ecf3;
        --muted: #9aa7b8;
        --border: #2a3441;
        --primary: #e7ecf3;
        --primary-hover: #ffffff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }
    .card {
      width: min(100%, 420px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.2rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }
    .error {
      color: #b91c1c;
      font-size: 0.92rem;
      margin-bottom: 1rem;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--primary);
      color: var(--card);
    }
    button:hover { background: var(--primary-hover); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Confirm sign-in</h1>
    {% if error_message %}
      <p class="error">{{ error_message }}</p>
    {% else %}
      <p class="subtitle">
        Continue to <strong>{{ company_name }}</strong> as <strong>{{ email }}</strong>?
      </p>
      <form method="post" action="{{ form_action }}">
        {% csrf_token %}
        <input type="hidden" name="token" value="{{ token }}">
        <input type="hidden" name="company_id" value="{{ company_id }}">
        <button type="submit">Continue sign-in</button>
      </form>
    {% endif %}
  </div>
</body>
</html>
