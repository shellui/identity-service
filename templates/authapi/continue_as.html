{% extends "agents/_mcp_base.html" %}
{% block title %}{{ continue_label }}{% endblock %}
{% block content %}
    {% if lead %}<p class="why">{{ lead }}</p>{% endif %}
    <form method="post" action="">
      {% csrf_token %}
      <div class="actions">
        <button type="submit" name="account_choice" value="continue" class="button">{{ continue_label }}</button>
      </div>
    </form>
    <form method="post" action="">
      {% csrf_token %}
      <button type="submit" name="account_choice" value="switch" class="button button-secondary">{{ switch_label }}</button>
    </form>
{% endblock %}
