<!DOCTYPE html>
<html lang="{{ page_language|default:'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #111827;
      --primary-hover: #1f2937;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1419;
        --card: #151b23;
        --text: #e7ecf3;
        --muted: #9aa7b8;
        --border: #2a3441;
        --primary: #e7ecf3;
        --primary-hover: #ffffff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }
    .card {
      width: min(100%, 420px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.2rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }
    a.button {
      display: block;
      text-align: center;
      text-decoration: none;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      background: var(--primary);
      color: var(--card);
    }
    a.button:hover { background: var(--primary-hover); }
  </style>
</head>
<body>
  <div class="card" data-desktop-return="{% if succeeded %}success{% else %}error{% endif %}">
    <h1>{{ title }}</h1>
    <p class="subtitle">{{ body }}</p>
    <a id="return-to-app" class="button" href="{{ return_url }}">{{ button }}</a>
  </div>
  <script>
    (function () {
      var link = document.getElementById('return-to-app');
      if (!link) return;
      window.location.href = link.href;
    })();
  </script>
</body>
</html>
