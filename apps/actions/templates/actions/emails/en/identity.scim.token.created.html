<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

          <tr>

  <p style="margin: 0 0 16px; font-size: 15px; color: #3f3f46;">Prefix: {{ data.token_prefix }}</p>
