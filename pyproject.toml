[project]
name = "identity-service"
version = "0.13.6"
description = "Authentication and identity service powering Shellui applications"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django==6.1.3",
    "django-allauth==65.23.0",
    "django-cors-headers==4.9.0",
    "djangorestframework==3.18.3",
    "djangorestframework-simplejwt==5.5.1",
    "drf-spectacular==0.30.0",
    "drf-spectacular-sidecar==2026.10.1",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "sentry-sdk==2.77.0",
    "gunicorn==27.0.1",
    "dj-database-url==3.1.2",
    "psycopg[binary]==3.3.9",
    "whitenoise==6.12.0",
    "cryptography==50.0.2",
    "django-scim2==0.24.0",
    "redis==8.2.0",
    "pyjwt>=2.14.0",
    "python3-saml>=1.16.0",
    "defusedxml>=0.7.1",
    "celery==5.7.0",
    "shellui-django[mcp,otel]==0.9.0",
]

[dependency-groups]
dev = []

[tool.uv]
package = false

# Temporary: shellui-django 0.9.0 is not on PyPI yet. Remove this source once it is released.
[tool.uv.sources]
shellui-django = { url = "https://github.com/shellui/django-commons/archive/0678dda529ae52da1266d3e0502209ec889dd83d.tar.gz" }
