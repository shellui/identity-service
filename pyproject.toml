[project]
name = "identity-service"
version = "0.13.6"
description = "Authentication and identity service powering Shellui applications"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django==6.0.8",
    "django-allauth==65.22.1",
    "django-cors-headers==4.9.0",
    "djangorestframework==3.18.2",
    "djangorestframework-simplejwt==5.5.1",
    "drf-spectacular==0.30.0",
    "drf-spectacular-sidecar==2026.10.1",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "sentry-sdk==2.75.0",
    "gunicorn==26.0.0",
    "dj-database-url==3.1.2",
    "psycopg[binary]==3.3.9",
    "whitenoise==6.12.0",
    "cryptography==50.0.2",
    "django-scim2==0.24.0",
    "redis==8.1.0",
    "pyjwt>=2.14.0",
    "python3-saml>=1.16.0",
    "defusedxml>=0.7.1",
    "celery==5.7.0",
    "shellui-django[mcp,otel]==0.7.2",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
