services:
  identity-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: shellui/identity-service:local
    container_name: identity-service
    ports:
      - "${IDENTITY_SERVICE_PORT:-8000}:8000"
    environment:
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required — copy .env.example to .env and set SECRET_KEY}"
      # Local compose: DEBUG=true (HS256 without JWT_PRIVATE_KEY). Set DEBUG=false + JWT_PRIVATE_KEY for production-like runs.
      DEBUG: "${DEBUG:-true}"
      JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY:-}"
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY:-}"
      JWT_KEY_ID: "${JWT_KEY_ID:-}"
      JWT_PREVIOUS_PUBLIC_KEY: "${JWT_PREVIOUS_PUBLIC_KEY:-}"
      JWT_PREVIOUS_KEY_ID: "${JWT_PREVIOUS_KEY_ID:-}"
      JWT_ACCEPT_HS256_LEGACY: "${JWT_ACCEPT_HS256_LEGACY:-false}"
      JWT_ISSUER: "${JWT_ISSUER:-}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-}"
      # Defaults use seconds to avoid Docker Compose treating "5m" as "$m".
      JWT_ACCESS_TOKEN_LIFETIME: "${JWT_ACCESS_TOKEN_LIFETIME:-300}"
      JWT_REFRESH_TOKEN_LIFETIME: "${JWT_REFRESH_TOKEN_LIFETIME:-604800}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-}"
      POSTGRES_DATABASE_URL: "${POSTGRES_DATABASE_URL:-}"
      REDIS_URL: "${REDIS_URL:-}"
      SQLITE_PATH: "/app/data/db.sqlite3"
      CORS_ALLOW_ALL_ORIGINS: "${CORS_ALLOW_ALL_ORIGINS:-true}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-4}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-4}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-60}"
      GUNICORN_GRACEFUL_TIMEOUT: "${GUNICORN_GRACEFUL_TIMEOUT:-30}"
      GUNICORN_KEEP_ALIVE: "${GUNICORN_KEEP_ALIVE:-75}"
      GUNICORN_MAX_REQUESTS: "${GUNICORN_MAX_REQUESTS:-1000}"
      GUNICORN_MAX_REQUESTS_JITTER: "${GUNICORN_MAX_REQUESTS_JITTER:-200}"
      EMAIL_TIMEOUT: "${EMAIL_TIMEOUT:-10}"
      POSTGRES_STATEMENT_TIMEOUT: "${POSTGRES_STATEMENT_TIMEOUT:-15}"
      POSTGRES_LOCK_TIMEOUT: "${POSTGRES_LOCK_TIMEOUT:-5}"
      LOG_LEVEL: "${LOG_LEVEL:-}"
      SLOW_REQUEST_THRESHOLD_SECONDS: "${SLOW_REQUEST_THRESHOLD_SECONDS:-2}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-}"
      SENTRY_RELEASE: "${SENTRY_RELEASE:-}"
      SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-0}"
      # Host email-service is on port 8003. localhost inside this container is not the host.
      EMAIL_SERVICE_URL: "http://host.docker.internal:8003"
      EMAIL_SERVICE_API_KEY: "${EMAIL_SERVICE_API_KEY:-}"
    volumes:
      - identity-service-data:/app/data
    restart: unless-stopped

volumes:
  identity-service-data:
